name: Build

on:
  push:
    branches: [main]
    # Un tag de version (ex. v1.2) construit le jeu, crée la Release si elle
    # n'existe pas, y attache les binaires et met à jour la page de
    # téléchargement.
    tags: ["v*"]
  # Une Release publiée sur GitHub avec un nouveau tag fait de même. Si le
  # tag déclenche aussi un push, la concurrence (même ref) n'en garde qu'un.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Plateformes à construire"
        type: choice
        default: all
        options:
          - all
          - windows
          - android
          - serveur
      build_type:
        description: "Type d'export"
        type: choice
        default: release
        options:
          - release
          - debug
      godot_version:
        description: "Version de Godot (tag godot-builds, ex. 4.7-stable). Vide = valeur par défaut du workflow."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version utilisée par défaut : elle doit correspondre à config/features de project.godot.
  GODOT_VERSION_DEFAULT: "4.7-stable"

jobs:
  prepare:
    name: Paramètres
    runs-on: ubuntu-latest
    outputs:
      godot-version: ${{ steps.config.outputs.godot-version }}
      build-type: ${{ steps.config.outputs.build-type }}
      build-id: ${{ steps.config.outputs.build-id }}
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Résoudre les paramètres de build
        id: config
        env:
          INPUT_GODOT_VERSION: ${{ inputs.godot_version }}
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          godot_version="${INPUT_GODOT_VERSION:-}"
          godot_version="${godot_version:-$GODOT_VERSION_DEFAULT}"

          build_type="${INPUT_BUILD_TYPE:-}"
          build_type="${build_type:-release}"

          # Les noms d'artefacts n'acceptent pas les « / » des branches type feat/xxx.
          slug="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"

          {
            echo "godot-version=$godot_version"
            echo "build-type=$build_type"
            echo "build-id=${slug}-${SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

          echo "Godot $godot_version · export $build_type · ${slug}-${SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Numéroter la version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Android refuse une mise à jour dont le code de version n'augmente
          # pas. Le code du preset sert de base, le numéro du run (qui croît à
          # chaque exécution du workflow) s'y ajoute ; le nom affiché prend le
          # numéro du run en dernier chiffre : 1.1 → 1.1.57. Pour une Release,
          # le nom est celui du tag : v1.2 → 1.2.
          python3 - <<'PY'
          import os
          import re

          run = int(os.environ["RUN_NUMBER"])
          with open(".github/export_presets.ci.cfg", encoding="utf-8") as handle:
              content = handle.read()

          code = re.search(r"^version/code=(\d+)$", content, re.MULTILINE)
          name = re.search(r'^version/name="([^"]*)"$', content, re.MULTILINE)
          if code is None or name is None:
              raise SystemExit("version/code ou version/name absent du preset Android")

          new_code = int(code.group(1)) + run
          new_name = "%s.%d" % (name.group(1), run)
          tag = os.environ.get("TAG", "")
          if os.environ["REF_TYPE"] == "tag" and tag:
              new_name = tag[1:] if re.match(r"^[vV]\d", tag) else tag
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("name=%s\ncode=%d\n" % (new_name, new_code))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Version %s (code Android %d)\n" % (new_name, new_code))
          print("version %s (code %d)" % (new_name, new_code))
          PY

  windows:
    name: Windows (x86_64)
    needs: prepare
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ needs.prepare.outputs.godot-version }}

      - name: Mettre en place les presets d'export
        run: cp .github/export_presets.ci.cfg export_presets.cfg

      - name: Inscrire la version dans le jeu
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
          # L'adresse de l'annuaire du mode en ligne (variable du dépôt) : sans
          # elle, le joueur la tape lui-même dans l'écran En ligne.
          ANNUAIRE_EN_LIGNE: ${{ vars.ANNUAIRE_EN_LIGNE }}
        run: |
          set -euo pipefail
          # Le menu l'affiche en bas à gauche (application/config/version).
          python3 - <<'PY'
          import os
          import re

          with open("project.godot", encoding="utf-8") as handle:
              content = handle.read()
          content, n = re.subn(r'^config/version="[^"]*"$', 'config/version="%s"' % os.environ["VERSION_NAME"],
                               content, count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit("config/version absent de project.godot")
          annuaire = os.environ.get("ANNUAIRE_EN_LIGNE", "").strip()
          if annuaire:
              content, n = re.subn(r'^config/annuaire_en_ligne="[^"]*"$',
                                   'config/annuaire_en_ligne="%s"' % annuaire.replace('"', ''),
                                   content, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit("config/annuaire_en_ligne absent de project.godot")
          with open("project.godot", "w", encoding="utf-8") as handle:
              handle.write(content)
          PY

      - name: Importer les ressources
        run: |
          set -euo pipefail
          # Premier passage : Godot génère .godot/ et importe les ressources.
          # Il peut sortir en erreur sur des avertissements ; c'est l'export qui tranche.
          godot --headless --path . --import \
            || echo "::warning title=Import Godot::L'import est sorti en erreur, on continue vers l'export."

      - name: Exporter le jeu
        env:
          BUILD_TYPE: ${{ needs.prepare.outputs.build-type }}
        run: |
          set -euo pipefail
          mkdir -p build/windows

          if [ "$BUILD_TYPE" = "debug" ]; then
            export_flag="--export-debug"
          else
            export_flag="--export-release"
          fi

          godot --headless --path . "$export_flag" "Windows Desktop" "$PWD/build/windows/SuperKart.exe"

          # Godot ne remonte pas toujours un code de sortie non nul : on vérifie la sortie.
          test -s build/windows/SuperKart.exe
          test -s build/windows/SuperKart.pck
          ls -lh build/windows

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: superkart-windows-${{ needs.prepare.outputs.build-id }}
          path: build/windows
          if-no-files-found: error
          retention-days: 14

  serveur:
    name: Serveur en ligne (Linux x86_64)
    needs: prepare
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'serveur' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Tester l'annuaire
        run: python3 -m unittest serveur/test_annuaire.py -v

      - name: Installer Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ needs.prepare.outputs.godot-version }}

      - name: Mettre en place les presets d'export
        run: cp .github/export_presets.ci.cfg export_presets.cfg

      - name: Inscrire la version dans le jeu
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
        run: |
          set -euo pipefail
          sed -i "s/^config\/version=\"[^\"]*\"$/config\/version=\"$VERSION_NAME\"/" project.godot
          grep -q "^config/version=\"$VERSION_NAME\"$" project.godot

      - name: Importer les ressources
        run: |
          set -euo pipefail
          godot --headless --path . --import \
            || echo "::warning title=Import Godot::L'import est sorti en erreur, on continue vers l'export."

      - name: Exporter le serveur
        run: |
          set -euo pipefail
          mkdir -p build/serveur/SuperKart-serveur
          # Un export release : le serveur tourne sans console de debug.
          godot --headless --path . --export-release "Serveur Linux" \
            "$PWD/build/serveur/SuperKart-serveur/SuperKart-serveur.x86_64"
          test -s build/serveur/SuperKart-serveur/SuperKart-serveur.x86_64
          test -s build/serveur/SuperKart-serveur/SuperKart-serveur.pck
          # Pour un serveur sans Docker ; avec Docker (Dokploy), l'image se
          # construit depuis le dépôt (serveur/Dockerfile).
          cp serveur/annuaire.py serveur/README.md build/serveur/SuperKart-serveur/

      - name: Vérifier qu'un salon s'ouvre
        run: |
          set -euo pipefail
          # Le serveur exporté, lancé comme l'annuaire le lance : il doit
          # ouvrir son salon dans les secondes qui suivent.
          cd build/serveur/SuperKart-serveur
          ./SuperKart-serveur.x86_64 --headless -- --serveur --port 8930 --nom Essai > "$RUNNER_TEMP/serveur.txt" 2>&1 &
          pid=$!
          sleep 15
          kill "$pid" || true
          cat "$RUNNER_TEMP/serveur.txt"
          grep -q "salon « Essai » ouvert sur le port 8930" "$RUNNER_TEMP/serveur.txt" \
            || { echo "::error title=Serveur::Le serveur exporté n'a pas ouvert de salon."; exit 1; }

      - name: Empaqueter
        run: |
          set -euo pipefail
          (cd build/serveur && zip -9 -r SuperKart-serveur-linux.zip SuperKart-serveur)
          ls -lh build/serveur

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: superkart-serveur-${{ needs.prepare.outputs.build-id }}
          path: build/serveur/SuperKart-serveur-linux.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (arm64-v8a)
    needs: prepare
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Installer platform-tools et build-tools
        run: |
          set -euo pipefail
          # Godot n'utilise du SDK que adb (platform-tools) et apksigner (build-tools) :
          # l'export passe par le modèle pré-compilé, pas par Gradle. On prend la dernière
          # version de build-tools publiée plutôt qu'une version figée qui finira retirée.
          build_tools="$(sdkmanager --list 2>/dev/null \
            | grep -oE 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -u -V | tail -1)"

          if [ -z "$build_tools" ]; then
            echo "::error title=SDK Android::Impossible de déterminer une version de build-tools."
            exit 1
          fi

          echo "build-tools retenu : $build_tools"
          sdkmanager --install "platform-tools" "$build_tools" > /dev/null

      - name: Installer Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ needs.prepare.outputs.godot-version }}

      - name: Préparer la clé de signature
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_NOUVELLE_CLE_BASE64: ${{ secrets.ANDROID_NOUVELLE_CLE_BASE64 }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          # Une nouvelle clé à faire attester par l'ancienne (voir plus bas) ?
          if [ -n "${ANDROID_NOUVELLE_CLE_BASE64:-}" ]; then
            echo "rotation=true" >> "$GITHUB_OUTPUT"
          fi

          # Godot exige toujours une clé de debug, même pour un export release.
          debug_keystore="$HOME/.android/debug.keystore"
          keytool -genkeypair -v -noprompt \
            -keystore "$debug_keystore" -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US" > /dev/null

          echo "debug-keystore=$debug_keystore" >> "$GITHUB_OUTPUT"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${ANDROID_KEYSTORE_USER:-}" ] \
            && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            release_keystore="$HOME/.android/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$release_keystore"
            echo "release-keystore=$release_keystore" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "$REF_TYPE" = "tag" ]; then
            # Une version publiée doit pouvoir s'installer par-dessus la
            # précédente : il lui faut toujours la même clé, pas une clé de
            # debug refaite à chaque build.
            echo "::error title=Signature Android::Une Release exige la clé de signature release : ajouter les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_USER et ANDROID_KEYSTORE_PASSWORD (voir docs/pipeline-de-build.md)."
            exit 1
          else
            echo "::notice title=Signature Android::Aucun secret de signature release trouvé, l'APK sera signé en debug."
            echo "release-keystore=" >> "$GITHUB_OUTPUT"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurer l'éditeur Godot pour Android
        env:
          DEBUG_KEYSTORE: ${{ steps.signing.outputs.debug-keystore }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          # Godot lit les chemins du SDK et la clé de debug dans ses réglages éditeur,
          # y compris en headless. GODOT_SETTINGS_VERSION est posé par l'action
          # d'installation à partir de la version réellement téléchargée.
          cat > "$HOME/.config/godot/editor_settings-${GODOT_SETTINGS_VERSION}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$DEBUG_KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Mettre en place les presets d'export
        env:
          RELEASE_KEYSTORE: ${{ steps.signing.outputs.release-keystore }}
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cp .github/export_presets.ci.cfg export_presets.cfg

          # Les secrets ne transitent jamais par la ligne de commande ni par les logs.
          python3 - <<'PY'
          import os

          keystore = os.environ.get("RELEASE_KEYSTORE", "")
          if not keystore:
              raise SystemExit(0)

          replacements = {
              'keystore/release=""': 'keystore/release="%s"' % keystore,
              'keystore/release_user=""': 'keystore/release_user="%s"'
              % os.environ["ANDROID_KEYSTORE_USER"],
              'keystore/release_password=""': 'keystore/release_password="%s"'
              % os.environ["ANDROID_KEYSTORE_PASSWORD"],
          }

          with open("export_presets.cfg", encoding="utf-8") as handle:
              content = handle.read()

          for needle, value in replacements.items():
              if needle not in content:
                  raise SystemExit("Ligne attendue absente du preset : %s" % needle)
              content = content.replace(needle, value)

          with open("export_presets.cfg", "w", encoding="utf-8") as handle:
              handle.write(content)
          PY

      - name: Appliquer le numéro de version
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
          VERSION_CODE: ${{ needs.prepare.outputs.version-code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          with open("export_presets.cfg", encoding="utf-8") as handle:
              content = handle.read()

          content, n_code = re.subn(r"^version/code=\d+$", "version/code=%s" % os.environ["VERSION_CODE"],
                                    content, count=1, flags=re.MULTILINE)
          content, n_name = re.subn(r'^version/name="[^"]*"$', 'version/name="%s"' % os.environ["VERSION_NAME"],
                                    content, count=1, flags=re.MULTILINE)
          if n_code != 1 or n_name != 1:
              raise SystemExit("version/code ou version/name absent du preset Android")

          with open("export_presets.cfg", "w", encoding="utf-8") as handle:
              handle.write(content)
          PY

      - name: Inscrire la version dans le jeu
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version-name }}
          # L'adresse de l'annuaire du mode en ligne (variable du dépôt) : sans
          # elle, le joueur la tape lui-même dans l'écran En ligne.
          ANNUAIRE_EN_LIGNE: ${{ vars.ANNUAIRE_EN_LIGNE }}
        run: |
          set -euo pipefail
          # Le menu l'affiche en bas à gauche (application/config/version).
          python3 - <<'PY'
          import os
          import re

          with open("project.godot", encoding="utf-8") as handle:
              content = handle.read()
          content, n = re.subn(r'^config/version="[^"]*"$', 'config/version="%s"' % os.environ["VERSION_NAME"],
                               content, count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit("config/version absent de project.godot")
          annuaire = os.environ.get("ANNUAIRE_EN_LIGNE", "").strip()
          if annuaire:
              content, n = re.subn(r'^config/annuaire_en_ligne="[^"]*"$',
                                   'config/annuaire_en_ligne="%s"' % annuaire.replace('"', ''),
                                   content, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit("config/annuaire_en_ligne absent de project.godot")
          with open("project.godot", "w", encoding="utf-8") as handle:
              handle.write(content)
          PY

      - name: Importer les ressources
        run: |
          set -euo pipefail
          godot --headless --path . --import \
            || echo "::warning title=Import Godot::L'import est sorti en erreur, on continue vers l'export."

      - name: Exporter l'APK
        id: export
        env:
          BUILD_TYPE: ${{ needs.prepare.outputs.build-type }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ steps.signing.outputs.debug-keystore }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.signing.outputs.release-keystore }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/android

          # Un export release sans clé de signature release échouerait : on retombe
          # alors sur un APK de debug, installable tel quel sur un téléphone.
          if [ "$BUILD_TYPE" = "release" ] && [ "$SIGNING_MODE" = "release" ]; then
            export_flag="--export-release"
            apk="SuperKart.apk"
          else
            export_flag="--export-debug"
            apk="SuperKart-debug.apk"
          fi

          godot --headless --path . "$export_flag" "Android" "$PWD/build/android/$apk"

          test -s "build/android/$apk"
          ls -lh build/android

          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Passer à la clé au nom du développeur
        # Rotation de clé (schéma de signature v3.1) : l'APK reste signé par
        # l'ancienne clé, qui atteste la nouvelle. Les téléphones qui ont déjà
        # le jeu acceptent donc la mise à jour, et Android 9+ retient la
        # nouvelle clé. Seulement si les secrets de la nouvelle clé existent.
        if: ${{ steps.signing.outputs.mode == 'release' && steps.signing.outputs.rotation == 'true' }}
        env:
          NOUVELLE_CLE: ${{ secrets.ANDROID_NOUVELLE_CLE_BASE64 }}
          NOUVELLE_CLE_USER: ${{ secrets.ANDROID_NOUVELLE_CLE_USER }}
          NOUVELLE_CLE_PASSWORD: ${{ secrets.ANDROID_NOUVELLE_CLE_PASSWORD }}
          ANCIENNE_CLE: ${{ steps.signing.outputs.release-keystore }}
          ANCIENNE_CLE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          ANCIENNE_CLE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK: build/android/${{ steps.export.outputs.apk }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          nouvelle="$RUNNER_TEMP/nouvelle.keystore"
          printf '%s' "$NOUVELLE_CLE" | base64 -d > "$nouvelle"
          # Les mots de passe passent par l'environnement, jamais par la ligne
          # de commande ni les journaux.
          "$apksigner" rotate --out "$RUNNER_TEMP/lignee" \
            --old-signer --ks "$ANCIENNE_CLE" --ks-key-alias "$ANCIENNE_CLE_USER" \
              --ks-pass env:ANCIENNE_CLE_PASSWORD --key-pass env:ANCIENNE_CLE_PASSWORD \
            --new-signer --ks "$nouvelle" --ks-key-alias "$NOUVELLE_CLE_USER" \
              --ks-pass env:NOUVELLE_CLE_PASSWORD --key-pass env:NOUVELLE_CLE_PASSWORD
          "$apksigner" sign \
            --ks "$ANCIENNE_CLE" --ks-key-alias "$ANCIENNE_CLE_USER" \
              --ks-pass env:ANCIENNE_CLE_PASSWORD --key-pass env:ANCIENNE_CLE_PASSWORD \
            --next-signer --ks "$nouvelle" --ks-key-alias "$NOUVELLE_CLE_USER" \
              --ks-pass env:NOUVELLE_CLE_PASSWORD --key-pass env:NOUVELLE_CLE_PASSWORD \
            --lineage "$RUNNER_TEMP/lignee" --rotation-min-sdk-version 28 \
            "$APK"
          rm -f "$nouvelle" "$RUNNER_TEMP/lignee"

      - name: Indiquer le signataire de l'APK
        env:
          APK: build/android/${{ steps.export.outputs.apk }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          {
            echo "### Signature de l'APK"
            echo '```'
            grep -E "certificate DN|certificate SHA-256" "$RUNNER_TEMP/certs.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: superkart-android-${{ needs.prepare.outputs.build-id }}
          path: build/android
          if-no-files-found: error
          retention-days: 14

  publier:
    name: Publier la Release
    needs: [prepare, windows, android, serveur]
    # Seulement pour un tag de version, et seulement si les deux plateformes
    # sont là : la page propose toujours les deux. Le serveur en ligne suit
    # s'il a été construit, sans retenir la Release.
    if: ${{ always() && github.ref_type == 'tag' && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Récupérer l'export Windows
        uses: actions/download-artifact@v4
        with:
          name: superkart-windows-${{ needs.prepare.outputs.build-id }}
          path: build/windows

      - name: Récupérer l'APK
        uses: actions/download-artifact@v4
        with:
          name: superkart-android-${{ needs.prepare.outputs.build-id }}
          path: build/android

      - name: Récupérer le serveur en ligne
        if: ${{ needs.serveur.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: superkart-serveur-${{ needs.prepare.outputs.build-id }}
          path: build/serveur

      - name: Attacher les binaires à la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Des noms fixes : la page et les liens partagés n'en changent pas.
          mkdir -p publication/SuperKart
          cp build/windows/SuperKart.exe build/windows/SuperKart.pck publication/SuperKart/
          (cd publication && zip -9 -r SuperKart-windows.zip SuperKart)
          cp build/android/SuperKart.apk publication/SuperKart.apk
          # Un tag poussé seul n'a pas encore de Release : on la crée, notes
          # tirées des PR et commits depuis le tag précédent.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "SuperKart ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" publication/SuperKart-windows.zip publication/SuperKart.apk --clobber
          if [ -s build/serveur/SuperKart-serveur-linux.zip ]; then
            gh release upload "$TAG" build/serveur/SuperKart-serveur-linux.zip --clobber
          fi
          ls -lh publication

      - name: Mettre à jour la page de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # La page se publie depuis main : l'environnement github-pages
          # n'accepte par défaut que la branche par défaut, pas un tag.
          gh workflow run pages.yml --ref main -f tag="$TAG"
