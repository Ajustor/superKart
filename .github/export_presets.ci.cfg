; Presets d'export utilisés par la CI uniquement.
;
; export_presets.cfg est gitignoré (il porte les chemins et les clés de signature
; locales de chaque poste). Ce fichier en est la version reproductible : la
; pipeline le copie vers export_presets.cfg avant d'exporter, sans jamais écraser
; celui d'un poste de dev puisqu'il vit dans .github/.
;
; Les options absentes reprennent les valeurs par défaut de Godot : on ne fige
; ici que ce qui compte pour un export headless.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="resources/icone/icone.ico"
exclude_filter="tests/*, tools/*, docs/*, addons/gut/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
; Godot 4.7 réécrit lui-même l'icône et les métadonnées de l'exécutable, sans
; rcedit ni Wine : vérifié par un export depuis Linux, le .exe contient bien
; l'icône du jeu (six tailles) et le nom « SuperKart ».
application/modify_resources=true
application/icon="res://resources/icone/icone.ico"
application/product_name="SuperKart"
application/company_name="Ajustor"
application/file_description="SuperKart"

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, docs/*, addons/gut/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; Export via le modèle pré-compilé : pas de build Gradle, donc pas de NDK à
; installer sur le runner.
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.ajustor.superkart"
package/name="SuperKart"
package/signed=true
version/code=2
version/name="1.1"
screen/immersive_mode=true
; L'icône, tirée de resources/icone/*.svg par tools/icone.py et tools/icone_png.gd.
; Premier plan et fond séparés : Android découpe l'icône adaptative à sa façon.
launcher_icons/main_192x192="res://resources/icone/icone_192.png"
launcher_icons/adaptive_foreground_432x432="res://resources/icone/icone_premier_plan_432.png"
launcher_icons/adaptive_background_432x432="res://resources/icone/icone_fond_432.png"
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
; Le multijoueur : se connecter, savoir si le Wi-Fi est là, et recevoir les
; annonces des parties du réseau local.
permissions/internet=true
permissions/access_network_state=true
permissions/access_wifi_state=true
permissions/change_wifi_multicast_state=true
; La mise à jour intégrée (scripts/core/mise_a_jour.gd) confie l'APK
; téléchargé à l'installeur du système : Android 8+ exige cette permission.
permissions/custom_permissions=PackedStringArray("android.permission.REQUEST_INSTALL_PACKAGES")
; Renseignés par la pipeline quand les secrets de signature sont présents.
keystore/release=""
keystore/release_user=""
keystore/release_password=""
